[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stripcomments"
version = "0.1.0"
description = "Remove comentários # de arquivos .py de projetos Django."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
stripcomments = "stripcomments.cli:main"

[tool.setuptools.packages.find]
include = ["stripcomments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
